version: '3.8'

services:
  # 1. Apache ja PHP (Debiani põhjal)
  web:
    image: php:8.2-apache
    container_name: debian_apache_php
    ports:
      - "80:80"
    volumes:
      - ./src:/var/www/html

  # 2. MySQL andmebaas
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: sinu_salajane_parool
      MYSQL_DATABASE: minu_andmebaas
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  # 3. phpMyAdmin veebiliides
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin_ui
    restart: always
    environment:
      PMA_HOST: db
    ports:
      - "8080:80"
    depends_on:
      - db

volumes:
  db_data:
