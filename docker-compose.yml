version: '3.8'

services:
  web:
    build: .
    container_name: autorent_web
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: autorent_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootparool
      MYSQL_DATABASE: autorent_db
      MYSQL_USER: appuser
      MYSQL_PASSWORD: appuserpass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      # SEE RIDA IMPORDIB ANDMEBAASI AUTOMAATSELT:
      - ./car_rent.sql:/docker-entrypoint-initdb.d/car_rent.sql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: autorent_pma
    restart: always
    environment:
      PMA_HOST: db
    ports:
      - "8080:80"
    depends_on:
      - db

volumes:
  db_data:
